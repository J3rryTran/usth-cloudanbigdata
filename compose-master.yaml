services:
  namenode:
    build: .
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9000:9000"
      - "9870:9870"
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site-master.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - /mnt/e/data-hdfs/namenode:/data/hdfs/namenode
    restart: unless-stopped

  datanode:
    build: .
    hostname: datanode1
    command: ["hdfs", "datanode"]
    ports:
      - "9866:9866"
      - "9864:9864"
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site-master.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - /mnt/e/data-hdfs/datanode:/data/hdfs/datanode
    restart: unless-stopped