services:
  namenode:
    build: .

    image: usth-cloudandbigdata:namenode-hdfs-hadoop-3.5.0
    container_name: namenode-master

    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9000:9000"
      - "9870:9870"
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - /mnt/e/data-hdfs/namenode:/data/hdfs/namenode # path/to/datanode
    restart: unless-stopped

  datanode:
    build: .

    image: usth-cloudandbigdata:datanode-hdfs-hadoop-3.5.0
    container_name: datanode-master

    hostname: datanode0
    command: ["hdfs", "datanode"]
    ports:
      - "9866:9866"
      - "9864:9864"
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - /mnt/e/data-hdfs/datanode:/data/hdfs/datanode # path/to/datanode
    restart: unless-stopped