# Spark execution
spark.app.name                         USTH-CloudAndBigdata
spark.dynamicAllocation.enabled        false

# Fixed resources for reproducible benchmarking
spark.executor.instances               2
spark.executor.cores                   2
spark.executor.memory                  2g
spark.cores.max                        4

# SQL / Shuffle partitions
spark.sql.shuffle.partitions           16
spark.default.parallelism              16

# # Default compression for initial cluster testing
# spark.shuffle.compress                 false
# spark.shuffle.spill.compress           false
# spark.io.compression.codec             lz4

# Event logging
spark.eventLog.enabled                 true
spark.eventLog.dir                     hdfs:///spark-events

# Spark UI
spark.ui.enabled                       true

# Driver networking
spark.driver.bindAddress               0.0.0.0
spark.driver.port                      39000
spark.driver.blockManager.port         39001

# Executor block transfer networking
spark.blockManager.port                39002