name: usth-spark-master

x-spark: &spark
  build:
    context: .
    dockerfile: dockerfile
  image: usth-cloudandbigdata:spark-4.2.1
  network_mode: host
  cgroup_parent: ${USTH_CGROUP_PARENT:-}
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777,exec
  logging:
    driver: local
    options:
      max-size: "5m"
      max-file: "2"
  volumes:
    - ../hdfs/conf/core-site.xml:/opt/hadoop-conf/core-site.xml:ro
    - ../hdfs/conf/hdfs-site.xml:/opt/hadoop-conf/hdfs-site.xml:ro
    - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

x-master-environment: &master-environment
  JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
  SPARK_LOCAL_IP: ${MASTER_TS_IP:?Set MASTER_TS_IP}
  SPARK_LOCAL_HOSTNAME: ${MASTER_TS_IP:?Set MASTER_TS_IP}

services:
  spark-master:
    <<: *spark
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      <<: *master-environment
      SPARK_DAEMON_MEMORY: 192m
      SPARK_MASTER_OPTS: -Dspark.master.rest.enabled=false
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - ${MASTER_TS_IP:?Set MASTER_TS_IP}
      - --port
      - "7077"
      - --webui-port
      - "8082"

  spark-client:
    <<: *spark
    profiles: [tools]
    mem_limit: 640m
    memswap_limit: 640m
    environment: *master-environment
    command: ["sleep", "infinity"]
    volumes:
      - ../hdfs/conf/core-site.xml:/opt/hadoop-conf/core-site.xml:ro
      - ../hdfs/conf/hdfs-site.xml:/opt/hadoop-conf/hdfs-site.xml:ro
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ../job:/opt/spark/jobs:ro
