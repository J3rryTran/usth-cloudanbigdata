services:
  spark-master:
    build: .

    image: usth-cloudandbigdata:spark-4.0.1_v0
    container_name: spark-master

    network_mode: host
    restart: unless-stopped

    environment:
      SPARK_NO_DAEMONIZE: "1"

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - ${MASTER_TS_IP:?MASTER_TS_IP is required}
      - --port
      - "7077"
      - --webui-port
      - "8080"

    volumes:
      - ./conf/core-site.xml:/opt/hadoop-conf/core-site.xml:ro
      - ./conf/hdfs-site-master.xml:/opt/hadoop-conf/hdfs-site.xml:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  spark-worker-1:
    image: usth-spark:4.0.1
    container_name: spark-worker-1

    network_mode: host
    restart: unless-stopped

    depends_on:
      - spark-master

    environment:
      JAVA_HOME: /opt/java/openjdk
      SPARK_LOCAL_DIRS: /data/spark/local

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --host
      - ${NODE_TS_IP:?NODE_TS_IP is required}
      - --port
      - "7078"
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - 3g
      - --work-dir
      - /data/spark/work
      - spark://${MASTER_TS_IP:?MASTER_TS_IP is required}:7077

    volumes:
      - ./conf/core-site.xml:/opt/hadoop-conf/core-site.xml:ro
      - ./conf/hdfs-site-master.xml:/opt/hadoop-conf/hdfs-site.xml:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - /mnt/e/data-spark:/data/spark

  spark-client:
    image: usth-spark:4.0.1
    container_name: spark-client

    profiles:
      - tools

    network_mode: host

    environment:
      JAVA_HOME: /opt/java/openjdk
      SPARK_LOCAL_DIRS: /tmp/spark-local

    command: ["sleep", "infinity"]

    volumes:
      - ./conf/core-site.xml:/opt/hadoop-conf/core-site.xml:ro
      - ./conf/hdfs-site-master.xml:/opt/hadoop-conf/hdfs-site.xml:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./jobs:/opt/spark/jobs:ro