services:
  spark-worker-2:
    build:
      context: .
      dockerfile: spark/Dockerfile

    image: usth-spark:4.0.1
    container_name: spark-worker-2

    network_mode: host
    restart: unless-stopped

    environment:
      JAVA_HOME: /opt/java/openjdk
      SPARK_LOCAL_DIRS: /data/spark/local

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --host
      - ${TS_IP:?TS_IP is required}
      - --port
      - "7078"
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - 3g
      - --work-dir
      - /data/spark/work
      - spark://${TS_IP:?TS_IP is required}:7077

    volumes:
      - ./conf/core-site.xml:/opt/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/hdfs-site.xml:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - /mnt/e/data-spark:/data/spark